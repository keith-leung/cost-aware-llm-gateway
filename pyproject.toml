[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-aware-gateway"
version = "0.1.0"
description = "Redis-backed cost-aware LLM gateway with per-user budget, 3-state circuit breaker, LiteLLM Router, and AgentLeak runtime redaction."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AgenticPortfolios"}]
keywords = [
  "llm", "gateway", "cost-aware", "circuit-breaker",
  "redis", "litellm", "denial-of-wallet", "agentleak",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "litellm>=1.82.9,<2.0",
  "redis>=5.0,<6.0",
  "pybreaker>=1.3,<2.0",
  "pydantic>=2.0,<3.0",
  "pyyaml>=6.0,<7.0",
  "tenacity>=8.0,<9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "fakeredis>=2.0,<3.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
cost-aware-gateway = "cost_aware_gateway.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
